name: Release

on:
  push:
    branches: [master, main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release PR and tags
      pull-requests: write
      # Mints the OIDC token that npm trusted publishing exchanges for a
      # short-lived credential, and that provenance is signed against.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Nothing ships that has not passed the same gates as a pull request.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm attw

      # Two ways to authenticate, and which one is in play decides how to read a
      # failure. Trusted publishing is preferred: it needs no long-lived secret
      # and npm attaches provenance automatically. A token still works, and both
      # may be configured at once, so this reports rather than blocks.
      - name: Report how this run will authenticate to npm
        env:
          TOKEN: ${{ secrets.NPM_TOKEN_CI || secrets.NPM_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "npm token present (${#TOKEN} characters) — usable as a fallback."
          else
            echo "No npm token set. This run must authenticate by trusted publishing."
          fi
          echo "OIDC is attempted first and takes precedence over any token."
          echo "If publish fails with 404 or 403, check that npmjs.com lists a trusted"
          echo "publisher for this package pointing at ${{ github.repository }} and release.yml."

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fallback only. pnpm tries OIDC first and it wins when npmjs.com has a
          # trusted publisher configured for this package; the token covers the
          # case where it does not, so enabling trusted publishing cannot strand a
          # release. Accepts either secret name, because renaming one previously
          # published with an empty token and failed as a confusing 403.
          #
          # Once a release has published by OIDC, delete both secrets and set
          # npmjs.com → Settings → Publishing access to disallow tokens.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_CI || secrets.NPM_TOKEN }}
          # Redundant under trusted publishing, which attaches provenance on its
          # own, but it is what produces provenance on the token path — and 0.1.0
          # shipped without any, because automation tokens carry no OIDC identity.
          NPM_CONFIG_PROVENANCE: 'true'
