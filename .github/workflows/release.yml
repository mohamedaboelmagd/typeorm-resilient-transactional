name: Release

on:
  push:
    branches: [master, main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release PR and tags
      pull-requests: write
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Nothing ships that has not passed the same gates as a pull request.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm attw

      # An unset token authenticates as nobody and npm reports it as a 403 about
      # two-factor authentication, which sends you looking in the wrong place.
      - name: Check the npm token is present
        env:
          TOKEN: ${{ secrets.NPM_TOKEN_CI || secrets.NPM_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Neither NPM_TOKEN_CI nor NPM_TOKEN is set. Add a repository secret" \
                 "containing an npm *Automation* token (classic), which bypasses 2FA for CI."
            exit 1
          fi
          echo "npm token present (${#TOKEN} characters)."

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Accepts either secret name, so renaming one does not silently publish
          # with an empty token — which fails as a confusing 403, not as "unset".
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_CI || secrets.NPM_TOKEN }}
          # Signs the published tarball with a link back to this workflow run,
          # so consumers can verify where it was built.
          NPM_CONFIG_PROVENANCE: 'true'
